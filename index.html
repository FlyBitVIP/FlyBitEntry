ius:var(--r-lg);background:linear-gradient(165deg,rgba(61,220,151,.14),rgba(255,255,255,.03) 48%,rgba(6,10,18,.28));box-shadow:var(--shadow);text-align:left;}.card.b{border-color:rgba(116,185,255,.24);background:linear-gradient(165deg,rgba(116,185,255,.15),rgba(255,255,255,.03) 48%,rgba(6,10,18,.28));}.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.10),transparent 55%);pointer-events:none;}.badge{position:relative;z-index:1;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(4,9,18,.42);color:#c7ffe6;font-size:12px;font-weight:700;letter-spacing:.02em;}.card.b .badge{color:#d6e9ff}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(61,220,151,.55);animation:pulse 2.4s ease-out infinite;}.card.b .dot{background:var(--sky);box-shadow:0 0 0 0 rgba(116,185,255,.55)}.idx{position:absolute;right:12px;top:2px;z-index:0;font-size:78px;font-weight:800;line-height:1;letter-spacing:-.06em;color:rgba(61,220,151,.13);pointer-events:none;}.card.b .idx{color:rgba(116,185,255,.15)}.domain{position:relative;z-index:1;flex:1;display:flex;align-items:flex-end;justify-content:center;text-align:center;margin:20px 0 16px;font-size:clamp(17px,4.4vw,22px);font-weight:750;line-height:1.28;letter-spacing:-.025em;color:#f8fbff;overflow-wrap:anywhere;}.card.b .domain{color:#f2f8ff}.card-foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;}.note{color:var(--muted);font-size:12px;line-height:1.5}.go{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:var(--mint);box-shadow:0 6px 16px rgba(61,220,151,.28);}.card.b .go{background:var(--sky);box-shadow:0 6px 16px rgba(116,185,255,.28)}.arrow{width:7px;height:7px;margin-left:-2px;border-top:2px solid #05271c;border-right:2px solid #05271c;transform:rotate(45deg);}.list{overflow:hidden;border:1px solid var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.03);box-shadow:0 10px 28px rgba(2,6,16,.32);}.row{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);text-align:left;}.row:last-child{border-bottom:0}.pip{flex:none;width:8px;height:8px;border-radius:50%;background:var(--sky)}.row.warn .pip{background:var(--coral)}.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.name{font-size:15px;font-weight:670;color:#e9f1fb;overflow-wrap:anywhere;letter-spacing:-.01em;}.row.warn .name{color:#ffd7d0}.desc{font-size:12px;color:var(--faint);line-height:1.45}.chev{flex:none;width:7px;height:7px;border-top:2px solid #8192a8;border-right:2px solid #8192a8;transform:rotate(45deg);}.foot{margin-top:38px;padding-top:22px;border-top:1px solid var(--line);text-align:center;}.slogan{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0}.slogan-features{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.slogan-features span{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border:1px solid rgba(116,185,255,.18);border-radius:999px;background:rgba(116,185,255,.06);color:#c7d4e6;font-size:12px;font-weight:600;letter-spacing:.06em}.slogan-features span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(61,220,151,.35)}.hint{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}kbd{display:inline-block;min-width:22px;padding:2px 7px;margin:0 2px;border:1px solid rgba(255,255,255,.16);border-bottom-width:2px;border-radius:6px;background:rgba(255,255,255,.07);color:#e8f0fa;font:inherit;font-size:12px;font-weight:600;line-height:1.35;text-align:center;}.foot small{color:var(--faint)}.card:focus-visible,.row:focus-visible{outline:2px solid var(--sky);outline-offset:3px}.card:active{transform:translateY(1px)}.row:active{background:rgba(255,255,255,.05)}@media (hover:hover){.card,.go,.row,.chev{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background-color .2s ease}.card:hover{transform:translateY(-4px);box-shadow:0 26px 52px rgba(2,6,16,.5)}.card.a:hover{border-color:rgba(61,220,151,.5)}.card.b:hover{border-color:rgba(116,185,255,.55)}.card:hover .go{transform:translateX(3px)}.row:hover{background:rgba(255,255,255,.05)}.row:hover .chev{border-color:var(--ink)}}@media (max-width:700px){.page{padding-left:16px;padding-right:16px}.hero{margin-bottom:28px}.brand{gap:14px}.cards{grid-template-columns:1fr;gap:12px}.card{min-height:150px}.idx{font-size:64px}.sec{margin-top:26px}}@media (prefers-reduced-motion:reduce){.orb,.dot,.card,.go,.row,.chev{animation:none!important;transition:none!important}}@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(22px,20px,0)}}@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}</style>

  <div class="bg" aria-hidden="true">

  <main class="page">

  <script>
  (function () {
    'use strict';

    /* ========== 域名拼接工具：按点号连接域名各部分 ========== */
    var j = function (a) { return a.join('.'); };

    // 网页跳转时直接截取域名之后的完整内容，原样保留路径、查询参数和哈希。
    // 本地预览不携带本地文件路径，仅保留查询参数和哈希。
    function tailPath() {
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        return location.href.slice(location.origin.length);
      }
      return location.search || location.hash ? '/' + location.search + location.hash : '';
    }

    /* ========== 入口数据：域名按点号拆分，路径单独保存 ========== */
    // https 为 false 时使用 HTTP；为 true 或未配置时使用 HTTPS。
    var primary = [
      {
        badge: '推荐入口',
        note: '推荐入口：点击进入',
        https: true,
        withUri: true,
        host: ['www', 'fastfastfast', 'buzz']
      },
      {
        badge: '推荐入口',
        note: '推荐入口：点击进入',
        https: true,
        withUri: true,
        host: ['www', 'fastfastfast', 'best']
      }
    ];

    var backup = [
      {
        label: 'GitHub',
        note: '说明：永不失联，点击进入',
        warn: false,
        https: true,
        withUri: false,
        host: ['github', 'com'],
        path: '/FlyBitVIP/FlyBit-Airport-Address'
      },
      {
        label: j(['flybit', 'vip']),
        note: '说明：墙外永久地址',
        warn: true,
        https: true,
        withUri: true,
        host: ['flybit', 'vip']
      }
    ];

    /* ========== 渲染 ========== */
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text !== undefined && text !== null) n.textContent = text;
      return n;
    }

    function target(item) {
      // 协议、域名和固定路径分别拼接，再按入口配置携带当前页面后缀。
      var protocol = item.https === false ? 'http://' : 'https://';
      var url = protocol + j(item.host) + (item.path || '');
      return item.withUri ? url + tailPath() : url;
    }

    function open(item) {
      var url = target(item);
      if (typeof gtag === 'function') {
        gtag('event', 'click_entry', { event_label: item.label || j(item.host || []), transport_type: 'beacon' });
      }
      var w = window.open(url, '_blank');
      if (w) { w.opener = null; return; }
      location.href = url; // 被拦截时的兜底
    }

    function renderCard(item, i) {
      var domain = j(item.host);
      var card = el('button', 'card ' + (i === 0 ? 'a' : 'b'));
      card.type = 'button';
      card.setAttribute('aria-label', item.badge + ' ' + domain);

      var badge = el('span', 'badge');
      var dot = el('span', 'dot');
      dot.setAttribute('aria-hidden', 'true');
      badge.appendChild(dot);
      badge.appendChild(document.createTextNode(item.badge));

      var idx = el('span', 'idx', '0' + (i + 1));
      idx.setAttribute('aria-hidden', 'true');

      var go = el('span', 'go');
      go.setAttribute('aria-hidden', 'true');
      go.appendChild(el('span', 'arrow'));

      var foot = el('span', 'card-foot');
      foot.appendChild(el('span', 'note', item.note));
      foot.appendChild(go);

      card.appendChild(badge);
      card.appendChild(idx);
      card.appendChild(el('span', 'domain', domain));
      card.appendChild(foot);
      card.addEventListener('click', function () { open(item); });

      document.getElementById('primary').appendChild(card);
    }

    function renderRow(item) {
      var text = item.label || j(item.host);
      var row = el('button', 'row' + (item.warn ? ' warn' : ''));
      row.type = 'button';
      row.setAttribute('aria-label', text + '，' + item.note);

      var pip = el('span', 'pip');
      pip.setAttribute('aria-hidden', 'true');

      var txt = el('span', 'txt');
      txt.appendChild(el('span', 'name', text));
      txt.appendChild(el('span', 'desc', item.note));

      var chev = el('span', 'chev');
      chev.setAttribute('aria-hidden', 'true');

      row.appendChild(pip);
      row.appendChild(txt);
      row.appendChild(chev);
      row.addEventListener('click', function () { open(item); });

      document.getElementById('backup').appendChild(row);
    }

    for (var i = 0; i < primary.length; i++) renderCard(primary[i], i);
    for (var k = 0; k < backup.length; k++) renderRow(backup[k]);

    /* ========== 收藏提示：按操作系统区分快捷键 ========== */
    (function bookmarkHint() {
      var box = document.getElementById('bookmarkHint');
      if (!box) return;

      var ua = navigator.userAgent || '';
      var platform = ((navigator.userAgentData && navigator.userAgentData.platform) || '') ||
                     (navigator.platform || '');
      var isApple = /mac|iphone|ipad|ipod/i.test(platform) || /Mac OS X|Macintosh/i.test(ua);
      var isMobile = /android|iphone|ipad|ipod|windows phone|mobile/i.test(ua) ||
                     (navigator.maxTouchPoints > 1 && /mac/i.test(platform));

      if (isMobile) {
        box.innerHTML = '手机端请点击浏览器菜单，选择 <strong>添加到主屏幕 / 加入书签</strong>';
      } else if (isApple) {
        box.innerHTML = '按 <kbd>⌘ Command</kbd> + <kbd>D</kbd> 收藏本页';
      } else {
        box.innerHTML = '按 <kbd>Ctrl</kbd> + <kbd>D</kbd> 收藏本页';
      }
    })();
  })();
  </script>
